<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>サイコロの旅</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#667085;--line:#d9dee5;--accent:#1d4ed8;--soft:#eaf0ff}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f25;--text:#f3f4f6;--muted:#aeb6c2;--line:#333a44;--accent:#7aa2ff;--soft:#1f315c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP","Yu Gothic UI",sans-serif;line-height:1.55}
button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:980px;margin:auto;padding:20px 14px 48px}h1{margin:0;font-size:clamp(1.8rem,5vw,2.5rem)}.lead,.muted{color:var(--muted)}.lead{margin:4px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1.35fr;gap:14px;align-items:start}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.field{display:grid;gap:6px;margin-top:12px}label{font-size:.88rem;font-weight:700}
select,input[type=text]{min-height:46px;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:0 12px}
.info{margin-top:10px;padding:11px;border-radius:12px;background:var(--soft);font-size:.88rem}.info p{margin:3px 0}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;font-size:.74rem}
.row{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.btn{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:9px 14px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.status{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.stat{border:1px solid var(--line);border-radius:12px;padding:10px}.stat small{color:var(--muted)}.stat b{display:block;overflow-wrap:anywhere}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}@media(max-width:540px){.choices{grid-template-columns:1fr}}
.choice{border:1px solid var(--line);border-radius:13px;padding:10px;display:grid;grid-template-columns:40px 1fr;gap:9px;transition:.16s}.choice.preview,.choice.winner{border-color:var(--accent);background:var(--soft);transform:translateY(-1px)}.choice.winner{border-width:2px;transform:scale(1.015)}.choice.dim{opacity:.5}.num{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-weight:850;font-size:1.1rem}.name{font-weight:800}.meta{font-size:.76rem;color:var(--muted)}.choice a{font-size:.78rem;color:var(--accent);text-decoration:none}
.dice{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.diceTop{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:center}.die{width:86px;height:86px;border:2px solid var(--line);border-radius:20px;display:grid;place-items:center;font-size:2.3rem;font-weight:900;user-select:none}.die.rolling{border-color:var(--accent);animation:shake .28s linear infinite}.die.landed{animation:land .48s ease}.result{font-size:1.25rem;font-weight:850}.reveal{animation:reveal .45s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-3px,2px) rotate(-8deg) scale(1.05)}40%{transform:translate(3px,-2px) rotate(7deg)}60%{transform:translate(-2px,-2px) rotate(-5deg) scale(1.04)}80%{transform:translate(2px,2px) rotate(5deg)}}
@keyframes land{45%{transform:scale(1.18) rotate(5deg)}70%{transform:scale(.96) rotate(-2deg)}}@keyframes reveal{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.manual{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:7px}.manual button{min-height:40px}.switch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.switch input{width:20px;height:20px}
.note{margin-top:14px;border-left:4px solid var(--accent);background:var(--soft);padding:10px 12px;border-radius:8px;font-size:.84rem}footer{margin-top:16px;color:var(--muted);font-size:.76rem}
@media(prefers-reduced-motion:reduce){.die.rolling,.die.landed,.reveal{animation:none}.choice{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<h1>🎲 サイコロの旅</h1>
<p class="lead">フリーきっぷを選び，移動するたびに次の6駅を抽選します．</p>
<div class="grid">
<section class="card">
<h2>旅の設定</h2>
<div class="field"><label for="pass">使うフリーきっぷ</label><select id="pass"></select></div>
<div class="info" id="ticketInfo"></div>
<div class="field"><label for="current">現在地</label><input id="current" type="text" value="津田沼"><span class="muted" style="font-size:.78rem">フリーエリア外からの往復は判定しません．</span></div>
<div class="field"><label for="mode">候補の選び方</label><select id="mode"><option value="balanced">エリア分散</option><option value="uniform">完全ランダム</option></select></div>
<div class="switch"><span><b>効果音</b><br><small class="muted">サイコロ演出中に短い音を鳴らす</small></span><input id="sound" type="checkbox"></div>
<div class="row"><button class="btn primary" id="newSet">6択を生成</button><button class="btn" id="reset">旅をリセット</button></div>
</section>
<section class="card">
<div class="status"><div class="stat"><small>現在地</small><b id="now">津田沼</b></div><div class="stat"><small>使用きっぷ</small><b id="nowPass">―</b></div></div>
<h2>次の6択</h2><div class="choices" id="choices"></div>
<div class="dice">
<div class="diceTop"><div class="die" id="die">―</div><div><small class="muted">出目</small><div class="result" id="result">まだ振っていません</div><small class="muted" id="sub">6択を生成してからサイコロを振ります．</small></div></div>
<div class="row"><button class="btn primary" id="roll" disabled>🎲 サイコロを振る</button><a class="btn" id="route" target="_blank" rel="noopener" style="display:none">経路を確認</a><button class="btn" id="arrived" disabled>この駅に到着</button></div>
<div style="margin-top:12px"><small class="muted">実物のサイコロを使う場合</small><div class="manual" id="manual"></div></div>
</div>
<div class="note"><b>ルール：</b>「この駅に到着」を押すと現在地を更新し，次の6択を自動生成します．現在駅と直前の駅は候補から除外します．時刻・帰宅可否・運休は判定しません．</div>
</section>
</div>
<footer>v0.2 ／ 2026-09-22時点の簡易データ．設定はブラウザのlocalStorageに保存します．</footer>
</div>
